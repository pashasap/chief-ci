name: Kit bounded simulator audit

# Public CI-only repository: standard GitHub-hosted runner only (never a -large/-xlarge label, which is billed).
#
# Two stop groups, each its own step with its own timeout and its own artifact upload, XL/offline/landscape first
# so the night's evidence cannot be the part a later timeout loses (F-61f096). Each group step reports its real
# status and the job is only green when every executed group passed (F-327ab0).
on:
  push:
    # Registration only: a workflow that exists only on a side branch is not listed for workflow_dispatch until it
    # has one run of its own. The push job does nothing but echo, so pushing this file never burns simulator time.
    branches: [ci/night-1118-harness]
    paths: ['.github/workflows/sim-audit.yml']
  workflow_dispatch:
    inputs:
      device:
        description: Simulator class
        type: choice
        options: [phone, tablet]
        default: phone
      group:
        description: Stop group
        type: choice
        options: [all, xl, light]
        default: all

concurrency:
  group: night-1118-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Sum of the step timeouts below (4+9+4+12+15+2 min = 2760s) fits this cap, which fits the 50-minute job cap:
  # even if every step is cut at its own limit, the job still ends with its verdict step run.
  JOB_CAP_S: "2820"
  AUDIT_DEVICE: ${{ inputs.device || 'phone' }}
  AUDIT_GROUP: ${{ inputs.group || 'all' }}

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Registration only (no simulator, no Xcode)
        run: echo "sim-audit.yml registered for workflow_dispatch on $GITHUB_REF; the audit runs only on dispatch"

  kit-sim:
    if: github.event_name == 'workflow_dispatch'
    # Standard (non-xlarge) label of the runner-images "Xcode 27" arm64 image (public preview), which ships
    # Xcode 27.0/27.1/27.2 and the iOS 27.0/27.1/27.2 simulator runtimes.
    runs-on: xcode-27
    # Step timeouts (4+9+4+12+15+2 = 46 min) fit inside this 50-minute cap, and the group budgets (660s + 780s)
    # fit inside JOB_CAP_S once the setup, build and boot limits are subtracted.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and simulator choice (no boot yet)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xg"
          curl -fsSL -o "$RUNNER_TEMP/xg/x.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xg/x.zip" -d "$RUNNER_TEMP/xg"
          XC=$(python3 - <<'PY'
          import pathlib, plistlib, re
          xs=[]
          for p in pathlib.Path('/Applications').glob('Xcode_*.app'):
              real=p.resolve()
              v=plistlib.load(open(real/'Contents/version.plist','rb'))
              version=v.get('CFBundleShortVersionString','')
              build=v.get('ProductBuildVersion','')
              beta='beta' in str(real).lower() or 'beta' in str(v).lower() or (build and build[-1].islower())
              if not beta: xs.append((tuple(int(n) for n in re.findall(r'\d+',version)),str(real)))
          assert xs, 'No stable Xcode found'
          print(max(xs)[1])
          PY
          )
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          sw_vers
          INFO=$(python3 - <<'PY'
          import json, re, subprocess, os
          j = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '-j']))
          pat = re.compile(r'iPhone (\d+) Pro') if os.environ['AUDIT_DEVICE'] == 'phone' else re.compile(r'iPad Pro.*')
          rts = [r for r in j['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable')
                 and any(pat.fullmatch(t['name']) for t in r.get('supportedDeviceTypes', []))]
          rt = max(rts, key=lambda r: [int(x) for x in r['version'].split('.')])
          phone = max((t for t in rt['supportedDeviceTypes'] if pat.fullmatch(t['name'])),
                      key=lambda t: [int(x) for x in re.findall(r'\d+',t['name'])])
          devs = j['devices'].get(rt['identifier'], [])
          udid = next((d['udid'] for d in devs if d['deviceTypeIdentifier'] == phone['identifier'] and d.get('isAvailable')), None)
          udid = udid or subprocess.check_output(['xcrun', 'simctl', 'create', phone['name'], phone['identifier'], rt['identifier']]).decode().strip()
          print('|'.join([udid, phone['name'], rt['name'] + ' (' + rt.get('buildversion', '') + ')']))
          PY
          )
          IFS='|' read -r UDID PHONE RT <<< "$INFO"
          echo "DEVICE phone=$PHONE udid=$UDID runtime=$RT xcode=$XC"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          mkdir -p ci/artifacts
          echo "phone=$PHONE runtime=$RT xcode=$XC $(xcodebuild -version | tr '\n' ' ')" > ci/artifacts/device.txt
          bash ci/stub/make_cert.sh "$RUNNER_TEMP/cert" > ci/artifacts/cert.txt 2>&1

      - name: XcodeGen and build-for-testing (generic destination, simulator not booted)
        timeout-minutes: 9
        run: |
          set +e
          "$RUNNER_TEMP/xg/xcodegen/bin/xcodegen" generate --spec ci/project.yml || exit 1
          A=ci/artifacts; mkdir -p $A
          T0=$(date +%s)
          build () {
            local log=$1; shift
            xcodebuild build-for-testing -project ci/Kit.xcodeproj -scheme Kit \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath ci/DD COMPILER_INDEX_STORE_ENABLE=NO \
              "$@" > $log 2>&1 &
            local pid=$! last=0 same=0
            while kill -0 $pid 2>/dev/null; do
              sleep 5; cur=$(wc -l < $log)
              if [ "$cur" = "$last" ]; then same=$((same+5)); else same=0; last=$cur; fi
              if [ $same -ge 180 ]; then echo "BUILD SILENT 180s; last: $(tail -1 $log | cut -c1-200)"; kill $pid; sleep 2; kill -9 $pid 2>/dev/null; pkill -f SWBBuildService; return 2; fi
            done
            wait $pid
          }
          build $A/build.log; RC=$?
          if [ $RC -ne 0 ]; then
            echo "BUILD FAILED with warnings-as-errors (rc=$RC):"; grep -E "error:|warning:" $A/build.log | sort -u | head -40
            cp $A/build.log $A/build-strict-failed.log
            pkill -f SWBBuildService
            build $A/build.log SWIFT_TREAT_WARNINGS_AS_ERRORS=NO || { grep -E "error:" $A/build.log | sort -u | head -40; tail -n 40 $A/build.log; exit 1; }
          fi
          echo "TIMING build=$(( $(date +%s) - T0 ))s, at $(( $(date +%s) - JOB_T0 ))s"
          echo "swift warning lines: $(grep -cE '\.swift:[0-9]+:[0-9]+: warning:' $A/build.log)"
          grep -E '\.swift:[0-9]+:[0-9]+: warning:' $A/build.log | sed -E 's#^.*/(Core|Sources|ci)/#\1/#' | sort -u | head -30
          PLIST=ci/DD/Build/Products/Debug-iphonesimulator/Kit.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print' "$PLIST" | grep -E "CFBundle(DisplayName|Identifier|URLSchemes)|chief|MinimumOS|Microphone|Speech" || true
          # Orientation policy as built. A landscape pass counts only if the app window really rotates, so record what
          # the packaged app declares for both families next to the geometry the test logs.
          for k in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            echo "plist $k: $(/usr/libexec/PlistBuddy -c "Print :$k" "$PLIST" 2>&1 | tr '\n' ' ')"
          done
          # Source identity: a sorted per-file SHA-256 of both roots plus the commit, so the artifacts can be tied to
          # the exact tree that produced them instead of to a branch name.
          { find Core/Sources/Core Sources/App -type f -print0 | sort -z | xargs -0 shasum -a 256
            echo "git-head $(git rev-parse HEAD)"; } > $A/source-manifest.txt
          echo "source manifest: $(wc -l < $A/source-manifest.txt | tr -d ' ') lines, digest $(shasum -a 256 $A/source-manifest.txt | cut -d' ' -f1)"
          head -3 $A/source-manifest.txt
          ls ci/DD/Build/Products/
          ls ci/DD/Build/Products/*.xctestrun > /dev/null 2>&1 || { echo "no xctestrun produced"; exit 1; }

      - name: Boot simulator and trust the throwaway CA
        timeout-minutes: 4
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A
          T0=$(date +%s)
          # bounded () <seconds> <cmd...>: runs a command, kills it after the given time, returns its rc (124 on kill).
          bounded () { local s=$1; shift; "$@" & local p=$!; ( sleep $s; kill $p 2>/dev/null ) & local w=$!; wait $p; local rc=$?; kill $w 2>/dev/null; return $rc; }
          # Trust the throwaway CA before the boot if simctl allows it on a shut-down device (it hung after boot in an earlier run).
          bounded 60 xcrun simctl keychain "$SIM_UDID" add-root-cert "$RUNNER_TEMP/cert/ca.pem"; PRE=$?
          echo "add-root-cert before boot rc=$PRE after $(( $(date +%s) - T0 ))s"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          echo "booted in $(( $(date +%s) - T0 ))s, at $(( $(date +%s) - JOB_T0 ))s"
          if [ $PRE -ne 0 ]; then
            T1=$(date +%s); bounded 240 xcrun simctl keychain "$SIM_UDID" add-root-cert "$RUNNER_TEMP/cert/ca.pem"
            echo "add-root-cert after boot rc=$? in $(( $(date +%s) - T1 ))s"
          fi
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 > /dev/null 2>&1 || true
          xcrun simctl ui "$SIM_UDID" appearance light
          echo "ready at $(( $(date +%s) - JOB_T0 ))s"
          true

      # ---- group 1: XL, offline, landscape (first, so its evidence survives any later failure) ----------------
      - name: Group XL/offline/landscape (own timeout, own artifacts)
        id: xl
        if: ${{ github.event_name == 'workflow_dispatch' && (env.AUDIT_GROUP == 'all' || env.AUDIT_GROUP == 'xl') }}
        timeout-minutes: 12
        continue-on-error: true
        env:
          GROUP_BUDGET_S: "660"
          # Floor, not a target: the group logs ~39 shots when the app behaves and its fallback paths are not taken.
          MIN_SHOTS: "30"
        run: bash ci/UITests/group_runner.sh xl

      - name: Upload XL/offline/landscape artifacts
        if: ${{ always() && steps.xl.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: kit-sim-xl
          retention-days: 3
          if-no-files-found: error
          path: |
            ci/artifacts/device.txt
            ci/artifacts/cert.txt
            ci/artifacts/build.log
            ci/artifacts/source-manifest.txt
            ci/artifacts/requests.jsonl
            ci/artifacts/xl/**

      # ---- group 2: light-mode actions, sheets, Share, dark ------------------------------------------------
      - name: Group light/actions (own timeout, own artifacts)
        id: light
        if: ${{ github.event_name == 'workflow_dispatch' && (env.AUDIT_GROUP == 'all' || env.AUDIT_GROUP == 'light') }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          GROUP_BUDGET_S: "780"
          # Floor, not a target: ~45 shots when the app behaves; about six of the named shots are fallback branches.
          MIN_SHOTS: "36"
        run: bash ci/UITests/group_runner.sh light

      - name: Upload light/actions artifacts
        if: ${{ always() && steps.light.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: kit-sim-light
          retention-days: 3
          if-no-files-found: error
          path: |
            ci/artifacts/device.txt
            ci/artifacts/source-manifest.txt
            ci/artifacts/requests.jsonl
            ci/artifacts/light/**

      # ---- verdict: the only place that decides the job's colour ------------------------------------------
      - name: Verdict (a required group that did not run, did not pass or lost its evidence makes the job red)
        if: always()
        timeout-minutes: 2
        run: |
          set +e
          A=ci/artifacts
          XL="${{ steps.xl.outcome }}"; LI="${{ steps.light.outcome }}"
          echo "group outcomes: xl=$XL light=$LI requested=$AUDIT_GROUP"
          FAIL=0
          # Required groups follow the request (all -> xl and light). The gate replays this exact script offline.
          bash ci/UITests/verdict.sh "$AUDIT_GROUP" "$XL" "$LI" "$A" || FAIL=1
          for g in xl light; do
            [ -f "$A/$g/pairing.txt" ] && { echo "--- $A/$g/pairing.txt"; cat "$A/$g/pairing.txt"; }
            [ -f "$A/$g/xcresult-summary.txt" ] && { echo "--- $A/$g/xcresult-summary.txt"; head -40 "$A/$g/xcresult-summary.txt"; }
          done
          [ -f "$A/source-manifest.txt" ] && { echo "--- source manifest"; tail -1 "$A/source-manifest.txt"; }
          echo "requests: $(wc -l < $A/requests.jsonl 2>/dev/null)"
          python3 -c "import json,sys; [print(e.get('method'), e.get('path'), e.get('status'), e.get('note','')) for e in map(json.loads, open(sys.argv[1]))]" $A/requests.jsonl 2>/dev/null | uniq -c | head -80
          xcrun simctl shutdown "$SIM_UDID" || true
          echo "total elapsed=$(( $(date +%s) - JOB_T0 ))s"
          exit $FAIL
