name: Kit simulator screens proof

# Public CI-only repository: standard GitHub-hosted runner only (never a -large/-xlarge label, which is billed).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ci/**'
      - '.github/workflows/kit-sim.yml'
      - 'Core/**'
      - 'Sources/**'
      - 'Info.plist'

concurrency:
  group: kit-sim
  cancel-in-progress: true

permissions:
  contents: read

env:
  JOB_CAP_S: "1200"

jobs:
  kit-sim:
    # Standard (non-xlarge) label of the runner-images "Xcode 27" arm64 image (public preview), which ships
    # Xcode 27.0/27.1/27.2 and the iOS 27.0/27.1/27.2 simulator runtimes.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and simulator choice (no boot yet)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xg"
          curl -fsSL -o "$RUNNER_TEMP/xg/x.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xg/x.zip" -d "$RUNNER_TEMP/xg"
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | python3 -c "import sys,re; xs=[l.strip() for l in sys.stdin]; print(max(xs,key=lambda x:[int(n) for n in re.findall(r'\\d+',x.split('Xcode_')[1])]))")
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          sw_vers
          INFO=$(python3 - <<'PY'
          import json, re, subprocess
          j = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '-j']))
          pat = re.compile(r'iPhone (\d+) Pro')
          rts = [r for r in j['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable')
                 and any(pat.fullmatch(t['name']) for t in r.get('supportedDeviceTypes', []))]
          rt = max(rts, key=lambda r: [int(x) for x in r['version'].split('.')])
          phone = max((t for t in rt['supportedDeviceTypes'] if pat.fullmatch(t['name'])),
                      key=lambda t: int(pat.fullmatch(t['name']).group(1)))
          devs = j['devices'].get(rt['identifier'], [])
          udid = next((d['udid'] for d in devs if d['deviceTypeIdentifier'] == phone['identifier'] and d.get('isAvailable')), None)
          udid = udid or subprocess.check_output(['xcrun', 'simctl', 'create', phone['name'], phone['identifier'], rt['identifier']]).decode().strip()
          print('|'.join([udid, phone['name'], rt['name'] + ' (' + rt.get('buildversion', '') + ')']))
          PY
          )
          IFS='|' read -r UDID PHONE RT <<< "$INFO"
          echo "DEVICE phone=$PHONE udid=$UDID runtime=$RT xcode=$XC"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          mkdir -p ci/artifacts
          echo "phone=$PHONE runtime=$RT xcode=$XC $(xcodebuild -version | tr '\n' ' ')" > ci/artifacts/device.txt
          bash ci/stub/make_cert.sh "$RUNNER_TEMP/cert" > ci/artifacts/cert.txt 2>&1

      - name: XcodeGen and build-for-testing (generic destination, simulator not booted)
        timeout-minutes: 9
        run: |
          set +e
          "$RUNNER_TEMP/xg/xcodegen/bin/xcodegen" generate --spec ci/project.yml || exit 1
          A=ci/artifacts; mkdir -p $A
          T0=$(date +%s)
          build () {
            local log=$1; shift
            xcodebuild build-for-testing -project ci/Kit.xcodeproj -scheme Kit \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath ci/DD COMPILER_INDEX_STORE_ENABLE=NO \
              "$@" > $log 2>&1 &
            local pid=$! last=0 same=0
            while kill -0 $pid 2>/dev/null; do
              sleep 5; cur=$(wc -l < $log)
              if [ "$cur" = "$last" ]; then same=$((same+5)); else same=0; last=$cur; fi
              if [ $same -ge 180 ]; then echo "BUILD SILENT 180s; last: $(tail -1 $log | cut -c1-200)"; kill $pid; sleep 2; kill -9 $pid 2>/dev/null; pkill -f SWBBuildService; return 2; fi
            done
            wait $pid
          }
          build $A/build.log; RC=$?
          if [ $RC -ne 0 ]; then
            echo "BUILD FAILED with warnings-as-errors (rc=$RC):"; grep -E "error:|warning:" $A/build.log | sort -u | head -40
            cp $A/build.log $A/build-strict-failed.log
            pkill -f SWBBuildService
            build $A/build.log SWIFT_TREAT_WARNINGS_AS_ERRORS=NO || { grep -E "error:" $A/build.log | sort -u | head -40; tail -n 40 $A/build.log; exit 1; }
          fi
          echo "TIMING build=$(( $(date +%s) - T0 ))s, at $(( $(date +%s) - JOB_T0 ))s"
          echo "swift warning lines: $(grep -cE '\.swift:[0-9]+:[0-9]+: warning:' $A/build.log)"
          grep -E '\.swift:[0-9]+:[0-9]+: warning:' $A/build.log | sed -E 's#^.*/(Core|Sources|ci)/#\1/#' | sort -u | head -30
          /usr/libexec/PlistBuddy -c 'Print' ci/DD/Build/Products/Debug-iphonesimulator/Kit.app/Info.plist | grep -E "CFBundle(DisplayName|Identifier|URLSchemes)|chief|MinimumOS|Microphone|Speech" || true
          ls ci/DD/Build/Products/

      - name: Boot simulator, trust the throwaway CA, start the stub
        timeout-minutes: 9
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A
          T0=$(date +%s)
          # bounded () <seconds> <cmd...>: runs a command, kills it after the given time, returns its rc (124 on kill).
          bounded () { local s=$1; shift; "$@" & local p=$!; ( sleep $s; kill $p 2>/dev/null ) & local w=$!; wait $p; local rc=$?; kill $w 2>/dev/null; return $rc; }
          # Trust the throwaway CA before the boot if simctl allows it on a shut-down device (it hung after boot in an earlier run).
          bounded 60 xcrun simctl keychain "$SIM_UDID" add-root-cert "$RUNNER_TEMP/cert/ca.pem"; PRE=$?
          echo "add-root-cert before boot rc=$PRE after $(( $(date +%s) - T0 ))s"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          echo "booted in $(( $(date +%s) - T0 ))s, at $(( $(date +%s) - JOB_T0 ))s"
          if [ $PRE -ne 0 ]; then
            T1=$(date +%s); bounded 240 xcrun simctl keychain "$SIM_UDID" add-root-cert "$RUNNER_TEMP/cert/ca.pem"
            echo "add-root-cert after boot rc=$? in $(( $(date +%s) - T1 ))s"
          fi
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 > /dev/null 2>&1 || true
          xcrun simctl ui "$SIM_UDID" appearance light
          codesign -dv --entitlements - ci/DD/Build/Products/Debug-iphonesimulator/Kit.app 2>&1 | grep -vE "^(CDHash|Hash|CandidateCDHash)" | head -20
          echo "ready at $(( $(date +%s) - JOB_T0 ))s"
          true

      - name: UI test with host helper and stall watchdog
        timeout-minutes: 12
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A/stall /tmp/kitctl /tmp/kitshots
          health () { curl -s --max-time 5 -o /dev/null -w "stub health http=%{http_code} $1\n" --cacert "$RUNNER_TEMP/cert/ca.pem" -H "Authorization: Bearer kit-sim-invented-token-0001" https://localhost:8443/v1/health; }
          nohup python3 -I ci/stub/stub_server.py --fixtures ci/stub/fixtures --cert "$RUNNER_TEMP/cert/chain.pem" \
            --key "$RUNNER_TEMP/cert/server.key" --token kit-sim-invented-token-0001 --port 8443 \
            --log "$GITHUB_WORKSPACE/$A/requests.jsonl" > $A/stub.out 2>&1 &
          echo $! > "$RUNNER_TEMP/stub.pid"
          for i in $(seq 1 20); do curl -s --max-time 3 --cacert "$RUNNER_TEMP/cert/ca.pem" -o /dev/null https://localhost:8443/ && break; sleep 0.5; done
          health start; ps -o pid,command -p "$(cat "$RUNNER_TEMP/stub.pid")" | tail -1 | cut -c1-60
          rm -f /tmp/kitctl/* /tmp/kitshots/*
          XTR=$(ls ci/DD/Build/Products/*.xctestrun | head -1); echo "xctestrun=$XTR"
          LIMIT=$(( JOB_CAP_S - 100 ))
          echo "test starts at $(( $(date +%s) - JOB_T0 ))s, cut-off at ${LIMIT}s"
          NSUnbufferedIO=YES xcodebuild test-without-building -xctestrun "$XTR" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:KitUITests/KitUITests/testScreens > $A/test.log 2>&1 &
          PID=$!; last=""; same=0; done_at=0; i=0
          while kill -0 $PID 2>/dev/null; do
            sleep 1; i=$((i+1))
            if [ $(( $(date +%s) - JOB_T0 )) -gt $LIMIT ]; then echo "JOB CUTOFF at t=$i"; xcrun simctl io "$SIM_UDID" screenshot $A/stall/cutoff.png > /dev/null 2>&1; break; fi
            if [ $done_at -eq 0 ] && grep -qE "Test Case .*(passed|failed)" $A/test.log; then done_at=$i; fi
            if [ $done_at -gt 0 ] && [ $((i - done_at)) -ge 8 ]; then echo "test finished; stopping lingering xcodebuild"; break; fi
            for req in $(grep -oE "REQUEST [a-z]+$" $A/test.log | awk '{print $2}' | sort -u); do
              [ -f "/tmp/kitctl/$req-ok" ] && continue
              case $req in
                openurl) xcrun simctl openurl "$SIM_UDID" "chief://pair?base=https%3A%2F%2Flocalhost%3A8443&token=kit-sim-invented-token-0001" ;;
                dark) xcrun simctl ui "$SIM_UDID" appearance dark ;;
                light) xcrun simctl ui "$SIM_UDID" appearance light ;;
                stopstub) kill "$(cat "$RUNNER_TEMP/stub.pid")" ;;
                revokemic) xcrun simctl privacy "$SIM_UDID" revoke microphone com.example.Chief ;;
              esac
              echo "host did $req rc=$? at t=$i"; touch "/tmp/kitctl/$req-ok"; health "after $req"
            done
            cur=$(grep -c "KIT \|t = " $A/test.log)
            if [ "$cur" = "$last" ]; then same=$((same+1)); else same=0; last=$cur; fi
            if [ $same -eq 30 ]; then
              APP=$(pgrep -f "Kit.app/Kit" | head -1)
              echo "STALL? t=$i app=${APP:-none} last=$(grep 'KIT ' $A/test.log | tail -1 | cut -c1-200)" | tee -a $A/stall/watch.txt
              xcrun simctl io "$SIM_UDID" screenshot $A/stall/t$i.png > /dev/null 2>&1
              [ -n "$APP" ] && sample "$APP" 2 -file $A/stall/t$i-sample.txt > /dev/null 2>&1
            fi
          done
          kill $PID 2>/dev/null; sleep 1; kill -9 $PID 2>/dev/null
          health end
          xcrun simctl spawn "$SIM_UDID" log show --last 15m --style compact --predicate 'process == "Kit"' 2>/dev/null \
            | grep -iE "nsurl|tls|ssl|trust|connection|keychain|error|fail" | grep -v "token" | cut -c1-300 | tail -150 > $A/app-log.txt
          echo "test result: $(grep -E 'Test Case .*(passed|failed)' $A/test.log | tail -1)"
          grep "KIT " $A/test.log | grep -v " shot " | cut -c1-300
          echo "shots: $(ls /tmp/kitshots | wc -l), at $(( $(date +%s) - JOB_T0 ))s"
          true

      - name: Collect (even after a timeout)
        if: always()
        timeout-minutes: 2
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A/shots
          cp /tmp/kitshots/*.png $A/shots/ 2>/dev/null
          ls $A/shots | wc -l
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i kit > $A/crash-reports.txt
          cp ~/Library/Logs/DiagnosticReports/Kit*.ips $A/stall/ 2>/dev/null
          echo "requests: $(wc -l < $A/requests.jsonl 2>/dev/null)"
          python3 -c "import json,sys; [print(e.get('method'), e.get('path'), e.get('status'), e.get('note','')) for e in map(json.loads, open(sys.argv[1]))]" $A/requests.jsonl 2>/dev/null | uniq -c | head -80
          echo "total elapsed=$(( $(date +%s) - JOB_T0 ))s"
          true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-sim-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ci/artifacts/*.log
            ci/artifacts/*.txt
            ci/artifacts/*.jsonl
            ci/artifacts/stub.out
            ci/artifacts/stall/**
            ci/artifacts/shots/**
