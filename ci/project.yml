name: Kit
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Core:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Core/Sources/Core
    settings:
      base:
        PRODUCT_NAME: Core
        SWIFT_VERSION: "6.0"
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  Kit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/App
      # CI-only: harmless if the app never uses SwiftPM resources (an Xcode app target has no Bundle.module).
      - path: Shims
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_NAME: Kit
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Chief
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_FILE: ../Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # CI-only: ad-hoc "sign to run locally" for the simulator, so the app gets the entitlements the
        # keychain needs (an unsigned simulator app cannot store its pairing token).
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
  KitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Chief.uitests
        TEST_TARGET_NAME: Kit
        SWIFT_VERSION: "5.0"
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_IDENTITY: ""
schemes:
  Kit:
    build:
      targets:
        Core: all
        Kit: all
        KitUITests: [test]
    test:
      targets:
        - KitUITests
